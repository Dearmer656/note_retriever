name: TMLR AE stats
on:
  push:
    paths:
      - 'tmlr_ae_stats.py'
      - '.github/workflows/tmlr-ae-stats.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openreview-py
      - run: python tmlr_ae_stats.py
      - uses: actions/upload-artifact@v4
        with:
          name: tmlr-ae-stats
          path: |
            tmlr_ae_stats.csv
            summary.json
